<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>html,body{margin:0;background:#020409;overflow:hidden}template{display:none}.module{position:relative;width:1280px;height:720px;overflow:hidden;background:#020409;color:#eff8ff;font-family:Arial,sans-serif}.grid{position:absolute;inset:0;background-image:linear-gradient(#07212b 1px,transparent 1px),linear-gradient(90deg,#07212b 1px,transparent 1px);background-size:64px 64px;opacity:.44}.energy-c,.energy-r{position:absolute;top:-160px;width:120px;height:1040px;transform:rotate(18deg);filter:blur(4px)}.energy-c{left:170px;background:#00e5ff;box-shadow:0 0 44px #00e5ff}.energy-r{right:170px;background:#ff264a;box-shadow:0 0 44px #ff264a}.silhouette{position:absolute;left:74px;bottom:45px;width:260px;height:430px;border-radius:46% 54% 42% 58%;background:radial-gradient(circle at 50% 25%,#eff8ff 0 9%,#87959b 10% 28%,#11161b 29% 62%,transparent 63%);filter:drop-shadow(-12px 0 18px #ff264a) drop-shadow(12px 0 18px #00e5ff)}.content{position:relative;width:100%;height:100%;padding:110px 90px 90px 420px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:22px}.code{font-size:20px;letter-spacing:.18em;color:#8fa8b5}.title{max-width:760px;font-size:58px;line-height:1;font-weight:900}.subtitle{max-width:760px;font-size:30px;line-height:1.2;font-weight:800;color:#00e5ff}.progress{width:720px;height:9px;background:#142830}.progress span{display:block;width:100%;height:100%;background:#00e5ff;transform-origin:left}</style></head><body>
<template id="products-template"><div data-composition-id="products-transition" data-width="1280" data-height="720" class="module"><div class="grid" data-layout-ignore></div><div class="energy-c" data-layout-ignore></div><div class="energy-r" data-layout-ignore></div><div class="silhouette" data-layout-ignore></div><div class="content"><div class="code">POL-7709 // MODULE NETWORK</div><div class="title">P.O.L.A.R. MODULE NETWORK</div><div class="subtitle">ACCESSING PRODUCT SYSTEMS</div><div class="progress"><span></span></div></div></div></template>
<template id="blueprint-template"><div data-composition-id="blueprint-transition" data-width="1280" data-height="720" class="module"><div class="grid" data-layout-ignore></div><div class="energy-c" data-layout-ignore></div><div class="energy-r" data-layout-ignore></div><div class="silhouette" data-layout-ignore></div><div class="content"><div class="code">POL-7709 // ARCHITECTURE</div><div class="title">BLUEPRINT™</div><div class="subtitle">ARCHITECTURE PROTOCOL INITIALIZED</div><div class="progress"><span></span></div></div></div></template>
<template id="drdocx-template"><div data-composition-id="drdocx-transition" data-width="1280" data-height="720" class="module"><div class="grid" data-layout-ignore></div><div class="energy-c" data-layout-ignore></div><div class="energy-r" data-layout-ignore></div><div class="silhouette" data-layout-ignore></div><div class="content"><div class="code">POL-7709 // DOCUMENT CORE</div><div class="title">DR.DOCX™</div><div class="subtitle">DOCUMENTATION CORE ONLINE</div><div class="progress"><span></span></div></div></div></template>
<template id="nexus-template"><div data-composition-id="nexus-transition" data-width="1280" data-height="720" class="module"><div class="grid" data-layout-ignore></div><div class="energy-c" data-layout-ignore></div><div class="energy-r" data-layout-ignore></div><div class="silhouette" data-layout-ignore></div><div class="content"><div class="code">POL-7709 // AUTOMATION</div><div class="title">NEXUS™</div><div class="subtitle">AUTOMATION PATHWAYS CONNECTING</div><div class="progress"><span></span></div></div></div></template>
<template id="about-template"><div data-composition-id="about-transition" data-width="1280" data-height="720" class="module"><div class="grid" data-layout-ignore></div><div class="energy-c" data-layout-ignore></div><div class="energy-r" data-layout-ignore></div><div class="silhouette" data-layout-ignore></div><div class="content"><div class="code">POL-7709 // ORIGIN RECORD</div><div class="title">FOUNDER INTELLIGENCE</div><div class="subtitle">ACCESSING ORIGIN RECORD</div><div class="progress"><span></span></div></div></div></template>
<template id="intake-template"><div data-composition-id="intake-transition" data-width="1280" data-height="720" class="module"><div class="grid" data-layout-ignore></div><div class="energy-c" data-layout-ignore></div><div class="energy-r" data-layout-ignore></div><div class="silhouette" data-layout-ignore></div><div class="content"><div class="code">POL-7709 // SECURE CHANNEL</div><div class="title">P.O.L.A.R. INTAKE</div><div class="subtitle">SECURE TRANSMISSION CHANNEL OPEN</div><div class="progress"><span></span></div></div></div></template>
<script>window.__timelines=window.__timelines||{};['products-transition','blueprint-transition','drdocx-transition','nexus-transition','about-transition','intake-transition'].forEach(id=>{const tl=gsap.timeline({paused:true});const s='[data-composition-id="'+id+'"] ';tl.from(s+'.grid',{opacity:0,duration:.22,ease:'power1.out'},.1);tl.from(s+'.energy-c',{x:-420,opacity:0,duration:.45,ease:'expo.out'},.1);tl.from(s+'.energy-r',{x:420,opacity:0,duration:.45,ease:'circ.out'},.1);tl.from(s+'.silhouette',{x:-70,scale:.9,opacity:0,duration:.42,ease:'back.out(1.2)'},.16);tl.from(s+'.code',{y:18,opacity:0,duration:.25,ease:'sine.out'},.18);tl.from(s+'.title',{x:60,opacity:0,duration:.34,ease:'power3.out'},.22);tl.from(s+'.subtitle',{y:28,opacity:0,duration:.3,ease:'back.out(1.4)'},.35);tl.from(s+'.progress span',{scaleX:0,duration:.66,ease:'power2.inOut'},.25);tl.to(s+'.content',{opacity:0,duration:.12,ease:'power1.in'},.9);window.__timelines[id]=tl;});</script></body></html>
