name: POLAR Security Checkpoint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect committed secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(sk-proj-[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY\s*=\s*[^$<{[:space:]]|OPENAI_API_KEY\s*=\s*[^$<{[:space:]])' -- ':!package-lock.json' ':!.github/workflows/polar-security-checkpoint.yml'; then
            echo 'Potential committed secret detected.' >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build checkpoint manifest
        shell: bash
        run: |
          mkdir -p checkpoint
          cat > checkpoint/manifest.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "security_checks": ["secret-scan", "lint", "build", "npm-audit-high"],
            "source_backup": "git-history",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload checkpoint manifest
        uses: actions/upload-artifact@v4
        with:
          name: polar-security-checkpoint-${{ github.sha }}
          path: checkpoint/manifest.json
          retention-days: 90
