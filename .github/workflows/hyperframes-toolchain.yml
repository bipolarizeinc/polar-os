name: HyperFrames Toolchain

on:
  push:
    paths:
      - "tools/hyperframes/**"
      - ".github/workflows/hyperframes-toolchain.yml"
  pull_request:
    paths:
      - "tools/hyperframes/**"
      - ".github/workflows/hyperframes-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-hyperframes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/hyperframes
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install HyperFrames CLI
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm install --no-audit --no-fund

      - name: Verify runtime
        run: |
          npx hyperframes info
          npx hyperframes doctor

      - name: Generate render projects
        run: node scripts/prepare-renders.mjs

      - name: Lint generated projects
        run: |
          for project in generated/*; do
            npx hyperframes lint "$project" --verbose
          done

      - name: Render all eight final clips
        env:
          OUTPUT_DIR: ${{ github.workspace }}/public/media/polar
        run: |
          mkdir -p "$OUTPUT_DIR"
          render_project() {
            project="$1"
            output="$2"
            (
              cd "generated/$project"
              npx hyperframes render --output "$OUTPUT_DIR/$output" --quality high --fps 30 --strict
            )
          }
          render_project greeting 01-polar-greeting.mp4
          render_project products-transition 02-products-transition.mp4
          render_project blueprint-transition 03-blueprint-transition.mp4
          render_project drdocx-transition 04-drdocx-transition.mp4
          render_project nexus-transition 05-nexus-transition.mp4
          render_project about-transition 06-about-transition.mp4
          render_project intake-transition 07-intake-transition.mp4
          render_project idle-inquiry 08-polar-idle-inquiry.mp4
          test "$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.mp4' | wc -l)" -eq 8

      - name: Upload final video pack
        uses: actions/upload-artifact@v4
        with:
          name: polar-os-hyperframes-final
          path: public/media/polar/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish rendered media to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/polar/*.mp4
          if git diff --cached --quiet; then
            echo "Rendered media unchanged."
          else
            git commit -m "chore(video): publish final POLAR HyperFrames renders"
            git push
          fi
