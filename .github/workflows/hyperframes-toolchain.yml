name: HyperFrames Toolchain

on:
  push:
    paths:
      - "tools/hyperframes/**"
      - ".github/workflows/hyperframes-toolchain.yml"
  pull_request:
    paths:
      - "tools/hyperframes/**"
      - ".github/workflows/hyperframes-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-hyperframes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/hyperframes
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install HyperFrames CLI
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm install --no-audit --no-fund

      - name: Verify runtime
        run: |
          npx hyperframes info
          npx hyperframes doctor

      - name: Generate standalone transition compositions
        run: node scripts/prepare-renders.mjs

      - name: Lint and inspect source compositions
        run: |
          npx hyperframes lint . --verbose
          npx hyperframes inspect . --samples 15

      - name: Render all eight final clips
        run: |
          mkdir -p ../../public/media/polar
          npx hyperframes render compositions/greeting.html --output ../../public/media/polar/01-polar-greeting.mp4 --quality high --fps 30 --strict
          npx hyperframes render generated/products-transition.html --output ../../public/media/polar/02-products-transition.mp4 --quality high --fps 30 --strict
          npx hyperframes render generated/blueprint-transition.html --output ../../public/media/polar/03-blueprint-transition.mp4 --quality high --fps 30 --strict
          npx hyperframes render generated/drdocx-transition.html --output ../../public/media/polar/04-drdocx-transition.mp4 --quality high --fps 30 --strict
          npx hyperframes render generated/nexus-transition.html --output ../../public/media/polar/05-nexus-transition.mp4 --quality high --fps 30 --strict
          npx hyperframes render generated/about-transition.html --output ../../public/media/polar/06-about-transition.mp4 --quality high --fps 30 --strict
          npx hyperframes render generated/intake-transition.html --output ../../public/media/polar/07-intake-transition.mp4 --quality high --fps 30 --strict
          npx hyperframes render compositions/idle-inquiry.html --output ../../public/media/polar/08-polar-idle-inquiry.mp4 --quality high --fps 30 --strict

      - name: Upload final video pack
        uses: actions/upload-artifact@v4
        with:
          name: polar-os-hyperframes-final
          path: public/media/polar/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish rendered media to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/polar/*.mp4
          if git diff --cached --quiet; then
            echo "Rendered media unchanged."
          else
            git commit -m "chore(video): publish final POLAR HyperFrames renders"
            git push
          fi
