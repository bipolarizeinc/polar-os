name: Render Nine Flagship Product Explainers

on:
  pull_request:
    paths:
      - 'tools/hyperframes/product-explainers/**'
      - '.github/workflows/render-nine-flagship-videos.yml'
  workflow_dispatch:

jobs:
  render-all:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install HyperFrames
        run: npm install --no-save hyperframes@0.7.77

      - name: Generate all compositions
        run: |
          rm -rf tools/hyperframes/product-explainers/generated
          node tools/hyperframes/product-explainers/generate.mjs
          test "$(find tools/hyperframes/product-explainers/generated -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 9

      - name: Prepare assets, narration, validate, and render all nine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renders/product-explainers
          slugs=(sav-vidzgen dr-docx blueprint brandforge launchpad nexus pulse vault cipher)
          for slug in "${slugs[@]}"; do
            project="tools/hyperframes/product-explainers/generated/$slug"
            cp public/brand/official/17_branded_environment.png "$project/assets/17_branded_environment.png"
            cp public/brand/polar/full-body-master.png "$project/assets/full-body-master.png"
            cp public/brand/bipolarization-symbol.png "$project/assets/bipolarization-symbol.png"
            espeak-ng -v en-us+m3 -s 168 -p 76 -a 145 -f "$project/narration.txt" -w "$project/audio/narration-raw.wav"
            ffmpeg -y -i "$project/audio/narration-raw.wav" -af "highpass=f=85,lowpass=f=9000,acompressor=threshold=-18dB:ratio=2.4:attack=18:release=180,loudnorm=I=-16:TP=-1.5:LRA=10,apad=pad_dur=27" -ar 48000 -t 27 "$project/audio/narration.wav"
            (
              cd "$project"
              npx hyperframes lint . --verbose
              npx hyperframes render --output "$GITHUB_WORKSPACE/renders/product-explainers/$slug.mp4" --fps 30 --quality high
            )
            test -s "renders/product-explainers/$slug.mp4"
            ffprobe -v error -show_entries format=filename,duration,size -of default=noprint_wrappers=1 "renders/product-explainers/$slug.mp4"
          done
          test "$(find renders/product-explainers -maxdepth 1 -type f -name '*.mp4' -size +0c | wc -l)" -eq 9

      - name: Create manifest
        run: |
          sha256sum renders/product-explainers/*.mp4 > renders/product-explainers/SHA256SUMS.txt
          ls -lh renders/product-explainers

      - name: Upload nine-video bundle
        uses: actions/upload-artifact@v4
        with:
          name: BPEI-Nine-Flagship-Product-Explainers-v1
          path: renders/product-explainers/
          retention-days: 30
          if-no-files-found: error
