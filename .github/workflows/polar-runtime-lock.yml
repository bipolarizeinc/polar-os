name: Refresh POLAR runtime lock

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.ref == 'agent/polar-runtime-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out runtime branch
        uses: actions/checkout@v4
        with:
          ref: agent/polar-runtime-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh dependency lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lock if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh POLAR runtime dependency lock'
          git push origin HEAD:agent/polar-runtime-v2
