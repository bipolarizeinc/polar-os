name: Package Approved POLAR Website Microvideos

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/hyperframes/polar-microvideos/**'
      - '.github/workflows/render-polar-approved-voice-microvideos.yml'

jobs:
  package-approved-masters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Validate approved asset registry
        run: |
          node - <<'NODE'
          const registry = require('./tools/hyperframes/polar-microvideos/approved-assets.json');
          if (!registry.policy.approvedOnly) throw new Error('Approved-only policy is disabled.');
          if (registry.websiteMicrovideoMasters.assets.length !== 8) throw new Error('Expected eight approved website masters.');
          if (!registry.music.driveFileId) throw new Error('Approved YA.wav Drive ID is missing.');
          console.log('Approved Drive registry validated.');
          NODE

      - name: Download approved website masters from canonical Drive library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renders/polar-website-microvideos

          node - <<'NODE' > /tmp/polar-assets.tsv
          const registry = require('./tools/hyperframes/polar-microvideos/approved-assets.json');
          for (const asset of registry.websiteMicrovideoMasters.assets) {
            process.stdout.write(`${asset.driveFileId}\t${asset.name}\n`);
          }
          NODE

          while IFS=$'\t' read -r id name; do
            output="renders/polar-website-microvideos/$name"
            echo "Downloading approved master: $name"
            curl --fail --location --retry 4 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              --output "$output"
            test -s "$output"
          done < /tmp/polar-assets.tsv

      - name: Validate all eight approved MP4 files
        shell: bash
        run: |
          set -euo pipefail
          count="$(find renders/polar-website-microvideos -maxdepth 1 -type f -name '*.mp4' | wc -l)"
          test "$count" -eq 8 || { echo "Expected 8 MP4 files, found $count"; exit 1; }

          for file in renders/polar-website-microvideos/*.mp4; do
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name,width,height,duration \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 "$file"
          done

      - name: Create website-compatible filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renders/website-public/media/polar
          cp renders/polar-website-microvideos/01_POLAR_Greeting.mp4 renders/website-public/media/polar/01_POLAR_Greeting.mp4
          cp renders/polar-website-microvideos/02_Products_Transition.mp4 renders/website-public/media/polar/02_Products_Transition.mp4
          cp renders/polar-website-microvideos/03_Blueprint_Transition.mp4 renders/website-public/media/polar/03_Blueprint_Transition.mp4
          cp renders/polar-website-microvideos/04_DrDocx_Transition.mp4 renders/website-public/media/polar/04_DrDocx_Transition.mp4
          cp renders/polar-website-microvideos/05_Nexus_Transition.mp4 renders/website-public/media/polar/05_Nexus_Transition.mp4
          cp renders/polar-website-microvideos/06_About_Transition.mp4 renders/website-public/media/polar/06_About_Transition.mp4
          cp renders/polar-website-microvideos/07_Intake_Transition.mp4 renders/website-public/media/polar/07_Intake_Transition.mp4
          cp renders/polar-website-microvideos/08_POLAR_Idle_Inquiry.mp4 renders/website-public/media/polar/08_POLAR_Idle_Inquiry.mp4

      - name: Create verification manifests
        shell: bash
        run: |
          sha256sum renders/polar-website-microvideos/*.mp4 > renders/polar-website-microvideos/SHA256SUMS.txt
          sha256sum renders/website-public/media/polar/*.mp4 > renders/website-public/SHA256SUMS.txt
          find renders -type f -printf '%p %s bytes\n' | sort

      - name: Upload approved master bundle
        uses: actions/upload-artifact@v4
        with:
          name: POLAR-Website-Microvideos-Approved-Masters
          path: renders/polar-website-microvideos/
          retention-days: 30
          if-no-files-found: error

      - name: Upload website-ready public bundle
        uses: actions/upload-artifact@v4
        with:
          name: POLAR-Website-Public-Media-Bundle
          path: renders/website-public/
          retention-days: 30
          if-no-files-found: error
