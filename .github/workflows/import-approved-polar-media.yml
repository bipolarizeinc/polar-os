name: Import approved POLAR media

on:
  push:
    branches:
      - agent/video-integration
    paths:
      - .github/workflows/import-approved-polar-media.yml

permissions:
  actions: read
  contents: write

jobs:
  integrate-media:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/video-integration

      - name: Download approved public media bundle
        run: |
          rm -rf /tmp/polar-media
          mkdir -p /tmp/polar-media
          gh run download 31132838994 \
            --repo bipolarizeinc/polar-os \
            --name POLAR-Website-Public-Media-Bundle \
            --dir /tmp/polar-media

      - name: Verify approved media integrity
        run: |
          cd /tmp/polar-media
          sha256sum -c SHA256SUMS.txt

      - name: Install public media assets
        run: |
          mkdir -p public/media/polar
          cp -f /tmp/polar-media/media/polar/*.mp4 public/media/polar/

      - name: Integrate transition media into homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()

          product_anchor = '        <section id="products" className={styles.suiteSection}>'
          product_insert = '''        <section className={styles.transitionBand} aria-label="P.O.L.A.R. division transition">
          <video src="/media/polar/02_Products_Transition.mp4" autoPlay muted loop playsInline preload="metadata" aria-hidden="true" />
          <div><span>P.O.L.A.R. ROUTING</span><strong>ENTERING DIVISION NETWORK</strong></div>
        </section>

''' + product_anchor
          if '02_Products_Transition.mp4' not in text:
              text = text.replace(product_anchor, product_insert)

          blueprint_anchor = '        <section className="section-shell blueprint-section">'
          blueprint_insert = '''        <section className={styles.transitionBand} aria-label="Bipolarized Blueprint transition">
          <video src="/media/polar/03_Blueprint_Transition.mp4" autoPlay muted loop playsInline preload="metadata" aria-hidden="true" />
          <div><span>FLAGSHIP SYSTEM</span><strong>BLUEPRINT EXTRACTION READY</strong></div>
        </section>

''' + blueprint_anchor
          if '03_Blueprint_Transition.mp4' not in text:
              text = text.replace(blueprint_anchor, blueprint_insert)

          cta_anchor = '        <section className="cta-section">'
          cta_insert = '''        <section className={`cta-section ${styles.videoCta}`}>
          <video className={styles.ctaVideo} src="/media/polar/07_Intake_Transition.mp4" autoPlay muted loop playsInline preload="metadata" aria-hidden="true" />'''
          if '07_Intake_Transition.mp4' not in text:
              text = text.replace(cta_anchor, cta_insert)

          page.write_text(text)

          css = Path('app/home.module.css')
          styles = css.read_text()
          marker = '.transitionBand{'
          if marker not in styles:
              styles += '''\n.transitionBand{position:relative;min-height:220px;display:grid;place-items:center;overflow:hidden;border-block:1px solid rgba(0,229,255,.16);background:#020507;isolation:isolate}.transitionBand video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.56;filter:saturate(.86) contrast(1.15);z-index:-2}.transitionBand:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(3,5,6,.92),rgba(3,5,6,.3),rgba(3,5,6,.92)),linear-gradient(180deg,rgba(0,229,255,.04),rgba(3,5,6,.7))}.transitionBand>div{display:grid;gap:9px;padding:48px 22px;text-align:center}.transitionBand span{color:#6d8d95;font:700 9px/1 var(--font-geist-mono);letter-spacing:.2em}.transitionBand strong{color:#e9feff;font:900 clamp(24px,4vw,48px)/1 var(--font-geist-sans);letter-spacing:-.04em}.videoCta{position:relative;overflow:hidden;isolation:isolate}.ctaVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.24;filter:saturate(.7) contrast(1.15);z-index:-3}.videoCta:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,229,255,.05),rgba(3,5,6,.88) 70%);z-index:-2;pointer-events:none}@media(max-width:700px){.transitionBand{min-height:170px}.transitionBand strong{font-size:24px}.ctaVideo{opacity:.16}}\n'''
              css.write_text(styles)
          PY

      - name: Commit verified media integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/polar app/page.tsx app/home.module.css
          git commit -m "Integrate approved POLAR website videos"
          git push origin HEAD:agent/video-integration
